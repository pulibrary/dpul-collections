version: 2.1

description: Common jobs for testing and building phoenix applications
orbs:
  node: circleci/node@7.2.1
executors:
  builder:
    parameters:
      elixir_version:
        type: string
        default: "1.20.4" # datasource=hexpm-bob depName=elixir
      erlang_version:
        type: string
        default: "29.1" # datasource=github-tags depName=erlang packageName=erlang/otp
      debian_version:
        type: string
        default: "trixie-20260918-slim" # datasource=docker depName=debian packageName=debian
    docker:
      - image: hexpm/elixir:<< parameters.elixir_version >>-erlang-<< parameters.erlang_version >>-debian-<< parameters.debian_version >>
        environment:
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_FIGGY_HOST: figgy_database
          TEST_POSTGRES_FIGGY_PORT: 5432
          SOLR_BASE_URL: http://localhost:8983
          MIX_ENV: test
      - image: cimg/postgres:15.2
      - image: cimg/postgres:15.2
        name: figgy_database
        environment:
          POSTGRES_PASSWORD: "postgres"
      - image: quay.io/pulibrary/ci-solr:9.9-v1.0.2
        command: server/scripts/ci-start.sh
        environment:
          SOLR_MODULES: 'analysis-extras,scripting'
          SOLR_CONFIG_LIB_ENABLED: true
          SOLR_SECURITY_MANAGER_ENABLED: false
          SOLR_PORT: 8983
          ZK_PORT: 9983
    working_directory: ~/project
  formatter:
    parameters:
      elixir_version:
        type: string
        default: "1.20.4" # datasource=hexpm-bob depName=elixir
      erlang_version:
        type: string
        default: "29.1" # datasource=github-tags depName=erlang packageName=erlang/otp
      debian_version:
        type: string
        default: "trixie-20260918-slim" # datasource=docker depName=debian packageName=debian
    docker:
      - image: hexpm/elixir:<< parameters.elixir_version >>-erlang-<< parameters.erlang_version >>-debian-<< parameters.debian_version >>
        environment:
          MIX_ENV: test
    working_directory: ~/project

commands:
  install-system-deps:
    steps:
      - run:
          name: Install system packages
          command: |
            apt-get update -y
            apt-get install -y --no-install-recommends git openssh-client ca-certificates curl zip build-essential postgresql-client
  install-deps:
    description: Installs mix and npm dependencies
    parameters:
      include-assets:
        type: boolean
        default: true
    steps:
      - restore_cache:
          keys:
            - v2-mix-cache-{{ .Branch }}-{{ checksum "mix.lock" }}
            - v2-mix-cache-{{ .Branch }}
            - v2-mix-cache
      - run:
          name: Install hex
          command: mix local.hex --force
      - run:
          name: Install rebar
          command: mix local.rebar --force
      - run:
          name: Install mix deps
          command: mix deps.get
      - restore_cache:
          keys:
            - v2-asset-cache-<< parameters.include-assets >>-{{ .Branch }}-{{ checksum "mix.lock" }}
            - v2-asset-cache-<< parameters.include-assets >>-{{ .Branch }}
            - v2-asset-cache-<< parameters.include-assets >>
      - when:
          condition: << parameters.include-assets >>
          steps:
            - node/install:
                node-version: '24.21.0'
            - run:
                name: Install elixir deps
                command: mix assets.setup
      - save_cache:
          key: v1-mix-cache-{{ .Branch }}-{{ checksum "mix.lock" }}
          paths:
            - "deps"
            - "_build"
      - save_cache:
          key: v2-mix-cache-{{ .Branch }}
          paths:
            - "deps"
            - "_build"
      - save_cache:
          key: v2-mix-cache
          paths:
            - "deps"
            - "_build"
      - save_cache:
          key: v2-asset-cache-<< parameters.include-assets >>-{{ .Branch }}-{{ checksum "mix.lock" }}
          paths:
            - "~/.cache/ms-playwright"
      - save_cache:
          key: v2-asset-cache-<< parameters.include-assets >>-{{ .Branch }}
          paths:
            - "~/.cache/ms-playwright"
      - save_cache:
          key: v2-asset-cache-<< parameters.include-assets >>
          paths:
            - "~/.cache/ms-playwright"

  mix-format:
    description: Validates code has been formatted with mix format
    steps:
      - run:
          name: Check elixir formatting
          command: mix format --check-formatted --dry-run

  mix-gettext-check:
    description: Validates no strings are left in LiveView without gettext calls.
    steps:
      - run:
          name: Check gettext
          command: mix gettext_check

jobs:
  check-formatting:
    executor: formatter
    steps:
      - install-system-deps
      - checkout
      - install-deps:
          include-assets: false
      - mix-format
  check-gettext:
    executor: formatter
    steps:
      - install-system-deps
      - checkout
      - install-deps:
          include-assets: false
      - mix-gettext-check

  run-unit-tests:
    executor: builder
    steps:
      - install-system-deps
      - checkout
      - install-deps:
          include-assets: true
      - run:
          name: Wait for solr
          command: timeout 60 bash -c 'until curl -s -o /dev/null localhost:8983; do sleep 2; done'
      - run:
          name: Load config into solr
          command: |
            SOLR_CONFIG_ROOT=solr/conf SOLR_HOST=localhost:8983 ./bin/setup_solr.sh
      - run:
          name: Setup fixtures
          command: mix fixtures.setup
      - run:
          name: Setup warnings as errors
          command: MIX_ENV=test mix compile --warnings-as-errors
      - run:
          name: Run tests
          command: mix test --trace
      - store_test_results:
          path: _build/test/lib/dpul_collections/test-junit-report.xml
      - store_artifacts:
          path: cover
          destination: cover
      - store_artifacts:
          path: screenshots
          destination: screenshots

workflows:
  version: 2
  build_accept_deploy:
    jobs:
      - check-formatting
      - check-gettext
      - run-unit-tests
